{% extends "base.html" %}
{% block title %}Register — SmartQueue{% endblock %}
{% block content %}
<div style="max-width:460px;margin:2.5rem auto;">
<div class="card">
  <h1 style="font-size:1.3rem;color:var(--accent);margin-bottom:1.2rem;"><svg style="width:1em;height:1em;vertical-align:-.15em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Create Student Account</h1>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="form-group"><label>Student ID *</label><input name="user_id" placeholder="e.g. STU/2024/001" required></div>
    <div class="form-group"><label>Full Name *</label><input name="full_name" placeholder="Your full name" required></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem;">
      <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="you@university.edu"></div>
      <div class="form-group"><label>Phone Number</label><input name="phone" placeholder="+234..."></div>
    </div>
    <div class="form-group"><label>Password * (min 8 chars)</label><input type="password" name="password" required></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;">Create Account →</button>
  </form>
  <p style="text-align:center;margin-top:1rem;font-size:.82rem;color:var(--muted);">
    Already registered? <a href="/login" style="color:var(--primary);">Login</a>
  </p>
</div>
</div>
{% endblock %}
