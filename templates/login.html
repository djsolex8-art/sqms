{% extends "base.html" %}
{% block title %}Login — SmartQueue{% endblock %}
{% block content %}
<div style="max-width:420px;margin:3rem auto;">
<div class="card">
  <div style="text-align:center;margin-bottom:1.4rem;">
    <div style="width:56px;height:56px;background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
      <svg style="width:28px;height:28px" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
        <div style="font-size:2.4rem;display:none"><svg style="width:1em;height:1em;vertical-align:-.15em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
    <h1 style="font-size:1.35rem;color:var(--accent);">Student Service Center</h1>
    <p style="color:var(--muted);font-size:.82rem;margin-top:.3rem;">Smart Queue Management System</p>
  </div>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="form-group"><label>Student / Staff ID</label>
      <input name="user_id" placeholder="Your ID" required autofocus></div>
    <div class="form-group"><label>Password</label>
      <input type="password" name="password" placeholder="Password" required></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;">Login →</button>
  </form>
  <div style="display:flex;justify-content:space-between;margin-top:1rem;font-size:.82rem;">
    <a href="/register" style="color:var(--primary);">New student? Register</a>
    <a href="/forgot-password" style="color:var(--muted);">Forgot password?</a>
  </div>
  <p style="margin-top:.9rem;font-size:.72rem;color:var(--muted);text-align:center;">
    Demo: <code>admin/Admin@123</code> · <code>staff01/Staff@123</code>
  </p>
</div>
</div>
{% endblock %}
