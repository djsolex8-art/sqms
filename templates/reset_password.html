{% extends "base.html" %}
{% block title %}Reset Password — SmartQueue{% endblock %}
{% block content %}
<div style="max-width:420px;margin:3rem auto;">
<div class="card">
  <h1 style="font-size:1.2rem;color:var(--accent);margin-bottom:1rem;"><svg style="width:1em;height:1em;vertical-align:-.15em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Reset Password</h1>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="form-group"><label>New Password (min 8 chars)</label>
      <input type="password" name="password" required></div>
    <div class="form-group"><label>Confirm Password</label>
      <input type="password" name="password2" required></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;">Set New Password</button>
  </form>
</div>
</div>
{% endblock %}
