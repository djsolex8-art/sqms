{% extends "base.html" %}
{% block title %}Forgot Password — SmartQueue{% endblock %}
{% block content %}
<div style="max-width:420px;margin:3rem auto;">
<div class="card">
  <h1 style="font-size:1.2rem;color:var(--accent);margin-bottom:1rem;"><svg style="width:1em;height:1em;vertical-align:-.15em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Forgot Password</h1>
  {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
  <form method="POST">
    <div class="form-group">
      <label>Registered Email Address</label>
      <input type="email" name="email" placeholder="your-email@university.edu" required>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;">Send Reset Link</button>
  </form>
  <p style="text-align:center;margin-top:1rem;font-size:.82rem;">
    <a href="/login" style="color:var(--primary);">← Back to Login</a>
  </p>
</div>
</div>
{% endblock %}
